repo_description_lines_max: 2

huggingface_groups:
  - name: Media Integrity Intelligence
    description: Datasets & models for factuality, checkworthiness, media bias, propaganda/persuasion, and hate -- across text, image, and multimodal LLM settings.
  - name: LlamaLens
    description: Base and language-specific model variants for multilingual instruction and analysis.
  - name: AraDiCE
    description: Arabic benchmark suites, transfer tasks, and evaluation resources.
  - name: Omni-modality
    description: Native and spoken omnimodal datasets designed for direct benchmarking and downstream use.
  - name: AI for Social Good
    description: Crisis-response, humanitarian, and multimodal resources for broad applied use.

