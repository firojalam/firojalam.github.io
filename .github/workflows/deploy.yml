# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 #ruby/setup-ruby@55283cc23133118229fd3f97f9336ee23a179fcf # v1.146.0
        with:
          ruby-version: '3.2.2' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify_indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Wait for IndexNow key file to be reachable
        env:
          INDEXNOW_KEY: A818B0D5A616F163D7972D88CCB56EE7
        run: |
          set -euo pipefail
          key_url="https://firojalam.one/${INDEXNOW_KEY}.txt"
          for attempt in $(seq 1 20); do
            status=$(curl -s -o /tmp/indexnow-key.txt -w "%{http_code}" "$key_url")
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "IndexNow key file was not reachable at $key_url"
          exit 1

      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: A818B0D5A616F163D7972D88CCB56EE7
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          sitemap_url = "https://firojalam.one/sitemap.xml"
          host = "firojalam.one"
          key = "A818B0D5A616F163D7972D88CCB56EE7"
          key_location = f"https://{host}/{key}.txt"

          with urllib.request.urlopen(sitemap_url) as response:
            sitemap_xml = response.read()

          root = ET.fromstring(sitemap_xml)
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          url_list = [loc.text.strip() for loc in root.findall("sm:url/sm:loc", ns) if loc.text]

          payload = json.dumps(
            {
              "host": host,
              "key": key,
              "keyLocation": key_location,
              "urlList": url_list[:10000],
            }
          ).encode("utf-8")

          request = urllib.request.Request(
            "https://api.indexnow.org/indexnow",
            data=payload,
            headers={"Content-Type": "application/json; charset=utf-8"},
          )

          with urllib.request.urlopen(request) as response:
            print(f"IndexNow status: {response.status}")
            print(response.read().decode("utf-8"))
          PY
